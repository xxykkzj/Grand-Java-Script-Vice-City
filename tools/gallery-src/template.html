<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Neon Coast - Asset Gallery</title>
<style>
:root{--bg:#0a0614;--panel:#140c26;--panel2:#1c1236;--line:#33205e;--txt:#e9e4ff;--dim:#9a8fc4;--cyan:#19f0ff;--pink:#ff3dcb;--amber:#ffc24a}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#2a0f4d 0,transparent 60%),radial-gradient(900px 600px at -10% 10%,#06303f 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
header{position:sticky;top:0;z-index:5;background:rgba(10,6,20,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
h1{margin:0;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 12px rgba(25,240,255,.6)}
h1 b{color:var(--pink);text-shadow:0 0 12px rgba(255,61,203,.6)}
#count{color:var(--dim);font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:8px;font:inherit}
input[type=search]{width:220px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:5px 11px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip:hover{color:var(--txt)}
.chip.on{color:#06121a;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(25,240,255,.5)}
main{padding:20px 22px 60px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover,.card:focus-visible{border-color:var(--pink);box-shadow:0 0 18px rgba(255,61,203,.35);transform:translateY(-2px);outline:none}
.thumb{height:190px;background:radial-gradient(circle at 50% 60%,#2b1a52,#120a24 75%);position:relative}
.thumb.err::after{content:"failed to load";position:absolute;inset:0;display:grid;place-items:center;color:#ff7b7b}
.thumb.wait::after{content:"loading...";position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px}
.meta{padding:10px 12px 12px;border-top:1px solid var(--line)}
.name{font-weight:650;font-size:15px;word-break:break-word}
.src{color:var(--dim);font-size:12.5px;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px}
.tag{padding:2px 7px;border-radius:6px;background:#241848;color:var(--txt);border:1px solid var(--line)}
.tag.lic{color:var(--amber);border-color:#5a4520}
.tag.cat{color:var(--cyan);border-color:#14525a}
.anim{margin-top:7px;font-size:12px;color:var(--pink)}
#empty{display:none;color:var(--dim);padding:40px;text-align:center}
#modal{position:fixed;inset:0;z-index:10;background:rgba(5,2,12,.92);display:none;grid-template-columns:1fr 320px}
#modal.open{display:grid}
#view{position:relative;cursor:grab;touch-action:none}
#view:active{cursor:grabbing}
#side{background:var(--panel);border-left:1px solid var(--line);padding:20px;overflow:auto}
#side h2{margin:0 0 4px;color:var(--cyan);font-size:20px;word-break:break-word}
#side dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:14px 0;font-size:14px}
#side dt{color:var(--dim)}#side dd{margin:0;word-break:break-word}
#side a{color:var(--cyan)}
#side label{display:block;color:var(--dim);font-size:13px;margin:14px 0 4px}
#side select{width:100%}
#close{position:absolute;top:12px;right:340px;z-index:30;background:var(--pink);border:0;color:#12031a;font-weight:700;border-radius:8px;padding:7px 14px;cursor:pointer}
#hint{position:absolute;left:16px;bottom:12px;color:var(--dim);font-size:12.5px;pointer-events:none}
#gl{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:20}
@media(max-width:800px){#modal{grid-template-columns:1fr;grid-template-rows:1fr 260px}#side{border-left:0;border-top:1px solid var(--line)}#close{right:12px}}
</style>
</head>
<body>
<header>
  <h1>Neon <b>Coast</b> / Assets</h1>
  <div class="ctl"><input id="q" type="search" placeholder="Search name, tag, source..." aria-label="Search"></div>
  <div class="ctl" id="cats" aria-label="Category filter"></div>
  <div class="ctl"><select id="src" aria-label="Source filter"></select></div>
  <span id="count"></span>
</header>
<main><div id="grid"></div><div id="empty">No models match.</div></main>
<div id="modal" role="dialog" aria-modal="true" aria-label="Model viewer">
  <div id="view"><button id="close">Close (Esc)</button><div id="hint">Drag to orbit, scroll to zoom, right-drag to pan</div></div>
  <aside id="side"></aside>
</div>
<canvas id="gl"></canvas>
<script>/*__BUNDLE__*/</script>
</body>
</html>
